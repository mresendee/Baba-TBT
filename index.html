<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Baba TBT</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101317">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baba TBT">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#101317; --card:#1C2026; --card-2:#20252c; --line:rgba(255,255,255,0.08);
  --green:#2E7D32; --green-light:#4CAF50; --white:#F5F6F7; --gray:#8A8F98; --gray-dim:#565B63;
  --gold:#E4B93B; --danger:#E5484D; --blue-card:#3D8FB3;
  --tier-bronze:#A0522D; --tier-prata:#B0B7BD; --tier-ouro:#E4B93B; --tier-platina:#5FC9BE; --tier-diamante:#6FB3F2; --tier-elite:#8B5CF6;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg); font-family:'Inter',sans-serif; color:var(--white); min-height:100vh; display:flex; justify-content:center;}
#shell{width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; position:relative;}
header{
  padding:18px 18px 12px; display:flex; align-items:center; gap:10px; justify-content:space-between;
  position:sticky; top:0; background:linear-gradient(180deg, var(--bg) 75%, transparent); z-index:6; border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; min-width:0;}
.logo{width:34px; height:34px; border-radius:9px; background:linear-gradient(160deg,var(--green-light),var(--green)); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
header h1{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:0.6px; margin:0; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
header .sub{font-size:10.5px; color:var(--gray);}

main{flex:1; padding:14px 16px 96px;}

.eyebrow{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--green-light); margin:16px 0 8px; display:flex; align-items:center; justify-content:space-between;}
.eyebrow small{font-family:'Inter',sans-serif; font-size:11px; color:var(--gray); text-transform:none; letter-spacing:0; font-weight:500;}

.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px;}
.row{display:flex; align-items:center; gap:10px;}
.between{justify-content:space-between;}

.btn{font-family:'Inter',sans-serif; font-weight:700; font-size:13px; border:none; border-radius:11px; padding:11px 15px; cursor:pointer;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--green); color:#fff;}
.btn-outline{background:transparent; border:1px solid var(--line); color:var(--white);}
.btn-danger{background:rgba(229,72,77,0.15); color:var(--danger); border:1px solid rgba(229,72,77,0.35);}
.btn-ghost{background:var(--card-2); color:var(--white);}
.btn-sm{padding:7px 10px; font-size:12px; border-radius:9px;}
.btn-block{width:100%;}
.btn:disabled{opacity:0.35; cursor:not-allowed;}

input[type=text], input[type=number], select{
  font-family:'Inter',sans-serif; background:var(--card-2); border:1px solid var(--line); color:var(--white);
  border-radius:10px; padding:10px 11px; font-size:13.5px; width:100%; outline:none;
}
input::placeholder{color:var(--gray-dim);}
input:focus, select:focus{border-color:var(--green-light);}
select option{color:#000;}
label.lbl{font-size:11px; color:var(--gray); margin-bottom:4px; display:block; font-weight:600;}
.field{margin-bottom:10px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}

.overall-badge{width:42px; height:50px; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:'Rajdhani',sans-serif; font-weight:700; flex-shrink:0; border:1.5px solid;
  background:linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0));}
.overall-badge .num{font-size:18px; line-height:1;}
.overall-badge .tier{font-size:7.5px; letter-spacing:0.3px; text-transform:uppercase; margin-top:2px; opacity:0.85;}
.tier-Bronze{border-color:var(--tier-bronze); color:var(--tier-bronze);}
.tier-Prata{border-color:var(--tier-prata); color:var(--tier-prata);}
.tier-Ouro{border-color:var(--tier-ouro); color:var(--tier-ouro);}
.tier-Platina{border-color:var(--tier-platina); color:var(--tier-platina);}
.tier-Diamante{border-color:var(--tier-diamante); color:var(--tier-diamante);}
.tier-Elite{border-color:var(--tier-elite); color:var(--tier-elite);}

.name{font-weight:700; font-size:14px;}
.meta{font-size:11.5px; color:var(--gray);}

.badge{font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:0.3px; white-space:nowrap;}
.badge-conf{background:rgba(76,175,80,0.16); color:var(--green-light);}
.badge-wait{background:rgba(228,185,59,0.16); color:var(--gold);}
.badge-guest{background:rgba(139,92,246,0.16); color:#a78bfa;}
.guest-card{border-color:rgba(167,139,250,0.55) !important; background:rgba(167,139,250,0.09);}
.guest-row{background:rgba(167,139,250,0.09); border-radius:8px; padding-left:6px; border-left:3px solid #a78bfa;}
.badge-abs{background:rgba(229,72,77,0.14); color:var(--danger);}
.badge-order{background:var(--green); color:#fff; font-family:'Rajdhani'; font-size:13px; min-width:22px; text-align:center;}

.empty{text-align:center; padding:38px 14px; color:var(--gray);}
.empty .icon{font-size:32px; display:block; margin-bottom:8px;}
.empty .msg{font-size:13px; line-height:1.5;}

nav#tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px;
  display:flex; background:rgba(16,19,23,0.95); backdrop-filter:blur(10px); border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:10;
}
nav#tabbar button{flex:1; background:none; border:none; color:var(--gray-dim); display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border-radius:10px;}
nav#tabbar button .ic{font-size:18px;}
nav#tabbar button .lb{font-size:9px; font-weight:700;}
nav#tabbar button.active{color:var(--green-light);}

.segrow{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
.seg{flex:1; min-width:70px; text-align:center; padding:8px 4px; border-radius:9px; font-size:11.5px; font-weight:700; background:var(--card-2); border:1px solid var(--line); color:var(--gray); cursor:pointer;}
.seg.on{background:var(--green); color:#fff; border-color:var(--green);}

.scoreboard{background:radial-gradient(140% 100% at 50% -20%, #1b3a20 0%, #0d1610 70%); border:1px solid rgba(76,175,80,0.25); border-radius:16px; padding:18px 12px; margin-bottom:12px;}
.sb-teams{display:flex; align-items:center; justify-content:space-between;}
.sb-team{flex:1; text-align:center; min-width:0;}
.sb-team .tname{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12.5px; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sb-team .ovr{font-size:10px; color:var(--gray); margin-top:2px;}
.sb-score{font-family:'Rajdhani',sans-serif; font-size:44px; font-weight:700; color:var(--white); font-variant-numeric:tabular-nums;}
.sb-x{font-family:'Rajdhani',sans-serif; font-size:16px; color:var(--gray-dim); padding:0 6px;}

.evrow{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:7px 0; border-bottom:1px dashed var(--line);}
.evrow:last-child{border-bottom:none;}

table.rank{width:100%; border-collapse:collapse; font-size:12.5px;}
table.rank th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.3px; color:var(--gray); padding:0 5px 7px; font-weight:700;}
table.rank td{padding:7px 5px; border-top:1px solid var(--line);}
table.rank td.num{font-family:'Rajdhani',sans-serif; font-size:15px; color:var(--green-light); text-align:center;}
.pos{width:20px; height:20px; border-radius:6px; background:var(--card-2); display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:var(--gray);}
.pos.p1{background:var(--gold); color:#1a1305;} .pos.p2{background:#c8ccc8; color:#111;} .pos.p3{background:#c98a4e; color:#1b0f04;}

.pillrow{display:flex; gap:8px; margin-bottom:10px;}
.pill{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 4px; text-align:center;}
.pill .v{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px;}
.pill .l{font-size:9px; color:var(--gray); text-transform:uppercase;}

.divider{height:1px; background:var(--line); margin:14px 0;}
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="brand"><div class="logo"><img src="icon-192.png" alt="Escudo" style="width:100%;height:100%;object-fit:cover;border-radius:9px;"></div><div><h1 id="groupName" onclick="renameGroup()">Baba TBT</h1><div class="sub" id="dateSub"></div></div></div>
    <button class="icon-btn" onclick="showGroupCodeMenu()" title="Código da pelada" style="background:none; border:none; color:var(--white); font-size:18px; cursor:pointer;">🔑</button>
    <button class="icon-btn" onclick="refreshData()" title="Atualizar dados" style="background:none; border:none; color:var(--white); font-size:18px; cursor:pointer;">🔄</button>
  </header>
  <main id="view"><div class="empty"><span class="icon">⏳</span><div class="msg">Carregando dados...</div></div></main>
  <nav id="tabbar">
    <button data-t="elenco" onclick="setTab('elenco')"><span class="ic">👥</span><span class="lb">ELENCO</span></button>
    <button data-t="chegada" onclick="setTab('chegada')"><span class="ic">🕐</span><span class="lb">CHEGADA</span></button>
    <button data-t="sorteio" onclick="setTab('sorteio')"><span class="ic">🎲</span><span class="lb">SORTEIO</span></button>
    <button data-t="partida" onclick="setTab('partida')"><span class="ic">🥅</span><span class="lb">PARTIDA</span></button>
    <button data-t="ranking" onclick="setTab('ranking')"><span class="ic">🏆</span><span class="lb">RANKING</span></button>
    <button data-t="financeiro" onclick="setTab('financeiro')"><span class="ic">💰</span><span class="lb">CAIXA</span></button>
  </nav>
</div>

<script>
/* ================= CÓDIGO DA PELADA (multi-tenant) ================= */
const LEGACY_CODE = 'BABATBT'; // aponta pros dados que já existiam antes desse sistema
const CODE_STORAGE_KEY = 'pelada_group_code';
function getGroupCode(){ return localStorage.getItem(CODE_STORAGE_KEY); }
function setGroupCode(code){ localStorage.setItem(CODE_STORAGE_KEY, code); }
function clearGroupCode(){ localStorage.removeItem(CODE_STORAGE_KEY); }
function generateCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sem O/0/I/1, pra evitar confusão na hora de digitar
  let code = '';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

/* ================= STATE ================= */
let state = {
  players: [],
  session: { date:'', checkins:[], teams:[], matches:[], grupos3:[], rodadaAtual:1 },
  settings: { groupName:'Minha Pelada' },
  despesas: [],
  loaded:false
};
let currentTab = 'elenco';

function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function todayLabel(){ return new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'}); }
function monthKey(){ return new Date().toISOString().slice(0,7); }
function nowTime(){ return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

/* ================= STORAGE ================= */
async function apiLoad(){
  const code = getGroupCode();
  const r = await fetch('/api/data?code=' + encodeURIComponent(code));
  if(!r.ok) throw new Error('Falha ao carregar dados do servidor');
  return await r.json();
}
async function saveKey(key, value){
  const code = getGroupCode();
  try{
    await fetch('/api/data', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code, key, value})
    });
  }catch(e){
    console.error('Erro ao salvar', key, e);
    alert('Não consegui salvar — verifique sua conexão com a internet.');
  }
}
async function savePlayers(){ await saveKey('players_pro', state.players); }
async function saveSession(){ await saveKey('session_pro', state.session); }
async function saveSettings(){ await saveKey('settings_pro', state.settings); }
async function saveDespesas(){ await saveKey('despesas_pro', state.despesas); }

function mergeSessionData(data){
  const incoming = data.session;
  const isNewDay = !incoming || incoming.date !== todayKey();
  state.session = {
    date: todayKey(),
    checkins: isNewDay ? [] : (incoming.checkins || []),
    matches: (incoming && incoming.matches) || [],
    teams: (incoming && incoming.teams) || [],
    grupos3: (incoming && incoming.grupos3) || [],
    rodadaAtual: (incoming && incoming.rodadaAtual) || 1
  };
  return isNewDay;
}
async function loadAll(){
  try{
    const data = await apiLoad();
    state.players = data.players || [];
    state.settings = data.settings || {groupName:'Minha Pelada'};
    state.despesas = data.despesas || [];
    const isNewDay = mergeSessionData(data);
    if(isNewDay) await saveSession();
  }catch(e){
    console.error('Erro ao carregar dados', e);
    alert('Não consegui conectar ao servidor. Verifique sua internet e puxe a tela para atualizar.');
    state.players = []; state.settings = {groupName:'Minha Pelada'}; state.despesas = [];
    state.session = { date: todayKey(), checkins:[], teams:[], matches:[], grupos3:[], rodadaAtual:1 };
  }
  state.loaded = true;
}

/* ================= HELPERS ================= */
function getPlayer(id){ return state.players.find(p=>p.id===id); }
function isCheckedIn(id){ return state.session.checkins.some(c=>c.playerId===id); }
function tierOf(level){
  return {1:'Bronze', 2:'Prata', 3:'Ouro', 4:'Platina', 5:'Elite'}[level] || 'Bronze';
}
function overallBadge(p){
  return `<div class="overall-badge tier-${tierOf(p.level)}"><div class="num">${p.level}</div><div class="tier">${tierOf(p.level)}</div></div>`;
}
function statusBadge(s){
  return {confirmado:'<span class="badge badge-conf">Confirmado</span>', ausente:'<span class="badge badge-abs">Ausente</span>',
    espera:'<span class="badge badge-wait">Lista de espera</span>'}[s] || '';
}
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function teamColorName(i){
  const t = state.session.teams && state.session.teams[i];
  if(t && t.name) return t.name;
  return 'Time ' + (i+1);
}
function teamColorHex(i){ return ['#2E7D32','#B0B7BD','#3D8FB3','#3a3f47','#C0392B','#E4B93B','#8B5CF6','#E08A2E'][i % 8]; }

/* ================= RENDER DISPATCH ================= */
function setTab(tab){
  currentTab = tab;
  perfilAberto = null;
  resumoAnualAberto = false;
  simulacaoAberta = false;
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.t===tab));
  refreshData();
}
async function refreshData(){
  try{
    const data = await apiLoad();
    state.players = data.players || [];
    state.settings = data.settings || {groupName:'Minha Pelada'};
    state.despesas = data.despesas || [];
    mergeSessionData(data);
  }catch(e){ console.warn('Não consegui atualizar agora', e); }
  render();
}
let perfilAberto = null;
let resumoAnualAberto = false;
let simulacaoAberta = false;
let simulacaoJogos = [];
function abrirPerfil(playerId){ perfilAberto = playerId; render(); }
function fecharPerfil(){ perfilAberto = null; render(); }
function abrirResumoAnual(){ resumoAnualAberto = true; render(); }
function fecharResumoAnual(){ resumoAnualAberto = false; render(); }
function abrirSimulacao(){ simulacaoAberta = true; render(); }
function fecharSimulacao(){ simulacaoAberta = false; render(); }
function render(){
  document.getElementById('dateSub').textContent = todayLabel();
  document.getElementById('groupName').textContent = state.settings.groupName;
  const view = document.getElementById('view');
  if(!state.loaded){ view.innerHTML = '<div class="empty"><span class="icon">⏳</span><div class="msg">Carregando...</div></div>'; return; }
  if(perfilAberto){ view.innerHTML = renderPerfilJogador(perfilAberto); return; }
  if(resumoAnualAberto){ view.innerHTML = renderResumoAnual(); return; }
  if(simulacaoAberta){ view.innerHTML = renderSimulacao(); return; }
  if(currentTab==='elenco') view.innerHTML = renderElenco();
  else if(currentTab==='chegada') view.innerHTML = renderChegada();
  else if(currentTab==='sorteio') view.innerHTML = renderSorteio();
  else if(currentTab==='partida') view.innerHTML = renderPartida();
  else if(currentTab==='ranking') view.innerHTML = renderRanking();
  else if(currentTab==='financeiro'){ view.innerHTML = renderFinanceiro(); desenharQrPix(); }
}
function renderResumoAnual(){
  const mk = currentFinanceiroMonth();
  const year = mk.split('-')[0];
  const players = state.players.filter(p=>!p.guest).sort((a,b)=>a.name.localeCompare(b.name));
  let html = `<button class="btn btn-ghost btn-sm" onclick="fecharResumoAnual()">← Voltar</button>`;
  html += `<div class="eyebrow" style="margin-top:10px;">Resumo de ${year} <small>todos os associados</small></div>`;

  if(players.length===0){
    html += `<div class="empty"><span class="icon">💰</span><div class="msg">Cadastre associados na aba Elenco primeiro.</div></div>`;
    return html;
  }

  let emDia=0, comPendencia=0;
  const linhas = players.map(p=>{
    const duesAno = (p.dues||[]).filter(d=>d.month && d.month.startsWith(year+'-'));
    const pagos = duesAno.filter(d=>d.status==='pago');
    const pendentes = duesAno.filter(d=>d.status!=='pago');
    const valorPago = pagos.reduce((s,d)=>s+d.value,0);
    const valorPendente = pendentes.reduce((s,d)=>s+d.value,0);
    if(duesAno.length>0 && pendentes.length===0) emDia++;
    else if(pendentes.length>0) comPendencia++;
    return { p, mesesPagos:pagos.length, mesesPendentes:pendentes.length, valorPago, valorPendente, temCobranca:duesAno.length>0 };
  });

  html += `<div class="pillrow">
    <div class="pill"><div class="v">${emDia}</div><div class="l">Em dia</div></div>
    <div class="pill"><div class="v">${comPendencia}</div><div class="l">Com pendência</div></div>
    <div class="pill"><div class="v">R$${linhas.reduce((s,l)=>s+l.valorPago,0)}</div><div class="l">Total recebido</div></div>
  </div>`;

  linhas.sort((a,b)=> b.mesesPendentes - a.mesesPendentes || a.p.name.localeCompare(b.p.name));
  html += `<div class="card">`;
  linhas.forEach(l=>{
    html += `<div class="row between" style="padding:8px 0; border-top:1px solid var(--line);">
      <div>
        <div class="name" style="font-size:14px; cursor:pointer; text-decoration:underline dotted;" onclick="abrirPerfil('${l.p.id}')">${escapeHtml(l.p.name)}</div>
        <div class="meta">${l.temCobranca ? `${l.mesesPagos} pago(s) · ${l.mesesPendentes} pendente(s)` : 'sem cobrança lançada no ano'}</div>
      </div>
      <div style="text-align:right;">
        <div class="meta" style="color:var(--green-light);">R$${l.valorPago}</div>
        ${l.valorPendente>0 ? `<div class="meta" style="color:var(--gold);">R$${l.valorPendente} em aberto</div>` : ''}
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}
function renderPerfilJogador(playerId){
  const p = getPlayer(playerId);
  if(!p) return `<button class="btn btn-ghost btn-sm" onclick="fecharPerfil()">← Voltar</button><div class="empty" style="margin-top:10px;"><span class="icon">👤</span><div class="msg">Jogador não encontrado.</div></div>`;
  const pct = (p.matchesPlayed||0)>0 ? Math.round((p.wins||0)/p.matchesPlayed*100) : 0;
  let html = `<button class="btn btn-ghost btn-sm" onclick="fecharPerfil()">← Voltar</button>`;
  html += `<div class="card" style="text-align:center; margin-top:10px;">
    <div style="display:flex; justify-content:center; margin-bottom:8px;">${overallBadge(p)}</div>
    <div class="name" style="font-size:18px;">${escapeHtml(p.name)} ${p.guest?'<span class="badge badge-guest">CONVIDADO</span>':''}</div>
    <div class="meta" style="margin-top:2px;">${p.position==='GOL'?'🧤 ':''}${p.position} · ${p.guest?'Convidado':'Associado'}</div>
    <div style="margin-top:8px;">${statusBadge(p.status)}</div>
  </div>`;

async function editarEstatisticas(playerId){
  const p = getPlayer(playerId); if(!p) return;
  if(!confirm(`Você vai corrigir manualmente os números de ${p.name} — use isso pra somar de volta dados que se perderam (ex: de uma rodada que sumiu). Vai passar por cada número um de cada vez. Continuar?`)) return;

  const jogos = prompt('Jogos disputados:', p.matchesPlayed||0); if(jogos===null) return;
  const gols = prompt('Gols:', p.goals||0); if(gols===null) return;
  const assist = prompt('Assistências:', p.assists||0); if(assist===null) return;
  const vitorias = prompt('Vitórias:', p.wins||0); if(vitorias===null) return;
  const amarelo = prompt('Cartões amarelos:', p.yellow||0); if(amarelo===null) return;
  const azul = prompt('Cartões azuis:', p.blue||0); if(azul===null) return;
  const vermelho = prompt('Cartões vermelhos:', p.red||0); if(vermelho===null) return;

  let jogosGK=null, sofridos=null, semSofrer=null;
  if(p.position==='GOL'){
    jogosGK = prompt('Jogos como goleiro:', p.gamesAsGK||0); if(jogosGK===null) return;
    sofridos = prompt('Gols sofridos:', p.goalsConceded||0); if(sofridos===null) return;
    semSofrer = prompt('Jogos sem sofrer gol:', p.cleanSheets||0); if(semSofrer===null) return;
  }

  p.matchesPlayed = Math.max(0, parseInt(jogos)||0);
  p.goals = Math.max(0, parseInt(gols)||0);
  p.assists = Math.max(0, parseInt(assist)||0);
  p.wins = Math.max(0, parseInt(vitorias)||0);
  p.yellow = Math.max(0, parseInt(amarelo)||0);
  p.blue = Math.max(0, parseInt(azul)||0);
  p.red = Math.max(0, parseInt(vermelho)||0);
  if(p.position==='GOL'){
    p.gamesAsGK = Math.max(0, parseInt(jogosGK)||0);
    p.goalsConceded = Math.max(0, parseInt(sofridos)||0);
    p.cleanSheets = Math.max(0, parseInt(semSofrer)||0);
  }
  await savePlayers();
  alert('Estatísticas atualizadas!');
  render();
}
function gerarImagemPerfil(playerId){
  const p = getPlayer(playerId); if(!p) return null;
  const pct = (p.matchesPlayed||0)>0 ? Math.round((p.wins||0)/p.matchesPlayed*100) : 0;
  const isGK = p.position==='GOL';
  const W = 720;
  const headerH = 170;
  const rowH = 44;
  const numRows = 6 + (isGK?3:0);
  const footerH = 46;
  const H = headerH + numRows*rowH + footerH;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#12171c');
  grad.addColorStop(1, '#0a0d10');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#4CAF50';
  ctx.font = 'bold 26px Arial, sans-serif';
  ctx.fillText(state.settings.groupName || 'Pelada', W/2, 42);

  const tierColors = {Bronze:'#A0522D', Prata:'#B0B7BD', Ouro:'#E4B93B', Platina:'#5FC9BE', Elite:'#8B5CF6'};
  const tc = tierColors[tierOf(p.level)] || '#8A8F98';
  ctx.strokeStyle = tc;
  ctx.lineWidth = 2.5;
  roundRect(ctx, W/2-32, 56, 64, 56, 10);
  ctx.stroke();
  ctx.fillStyle = tc;
  ctx.font = 'bold 26px Arial, sans-serif';
  ctx.fillText(String(p.level), W/2, 90);
  ctx.font = 'bold 11px Arial, sans-serif';
  ctx.fillText(tierOf(p.level).toUpperCase(), W/2, 105);

  ctx.fillStyle = '#F5F6F7';
  ctx.font = 'bold 24px Arial, sans-serif';
  ctx.fillText(p.name, W/2, 140);
  ctx.fillStyle = '#8A8F98';
  ctx.font = '14px Arial, sans-serif';
  ctx.fillText(`${p.position}${isGK?' 🧤':''} · ${p.guest?'Convidado':'Associado'}`, W/2, 160);

  const linhas = [
    ['Jogos', p.matchesPlayed||0],
    ['Gols', p.goals||0],
    ['Assistências', p.assists||0],
    ['Vitórias', p.wins||0],
    ['Aproveitamento', pct+'%'],
    ['Cartões (🟨🟦🟥)', `${p.yellow||0} · ${p.blue||0} · ${p.red||0}`],
  ];
  if(isGK){
    linhas.push(['Jogos no gol', p.gamesAsGK||0]);
    linhas.push(['Gols sofridos', p.goalsConceded||0]);
    linhas.push(['Sem sofrer gol', p.cleanSheets||0]);
  }

  let y = headerH;
  linhas.forEach((l,i)=>{
    if(i%2===0){ ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(24,y,W-48,rowH); }
    ctx.fillStyle = '#8A8F98';
    ctx.font = '16px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(l[0], 42, y+28);
    ctx.fillStyle = '#E4B93B';
    ctx.font = 'bold 18px Arial, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(String(l[1]), W-42, y+28);
    y += rowH;
  });

  ctx.fillStyle = '#565B63';
  ctx.font = '13px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Gerado pelo app da pelada', W/2, H-18);

  return canvas;
}
async function compartilharPerfil(playerId){
  const canvas = gerarImagemPerfil(playerId);
  if(!canvas){ alert('Não encontrei esse jogador.'); return; }
  await compartilharImagemGenerica(canvas, 'desempenho.png', 'Desempenho');
}

async function compartilharImagemGenerica(canvas, filename, titulo){
  canvas.toBlob(async (blob)=>{
    if(!blob){ alert('Não consegui gerar a imagem.'); return; }
    const file = new File([blob], filename, {type:'image/png'});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ files:[file], title:titulo, text:`${titulo} — ${state.settings.groupName}` });
        return;
      }
    }catch(e){
      if(e && e.name==='AbortError') return;
      console.error(e);
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    alert('Esse aparelho não abriu o compartilhamento direto, então a imagem foi baixada — é só anexar ela manualmente no WhatsApp.');
  }, 'image/png', 0.95);
}

async function editPlayer(id){
  const p = getPlayer(id); if(!p) return;
  const name = prompt('Nome:', p.name); if(name===null) return;
  const position = (prompt('Posição (GOL, ZAG, MEI, ATA):', p.position) || p.position).toUpperCase();
  const levelStr = prompt('Nível técnico (1 a 5):', p.level); if(levelStr===null) return;
  const level = Math.max(1, Math.min(5, parseInt(levelStr)||p.level));
  const statusStr = prompt('Associado ou Convidado? Digite "associado" ou "convidado":', p.guest ? 'convidado' : 'associado');
  if(statusStr===null) return;
  const guest = statusStr.trim().toLowerCase().startsWith('c');
  p.name = name.trim() || p.name;
  p.position = ['GOL','ZAG','MEI','ATA'].includes(position) ? position : p.position;
  p.level = level;
  p.guest = guest;
  await savePlayers();
  render();
}

}

  html += `<div class="divider"></div>
    <button class="btn btn-danger btn-block" onclick="encerrarPeladaDoDia()">🏁 Encerrar pelada de hoje (zera chegada, confirmações e partidas)</button>`;

function associadosPresentes(){
  return state.session.checkins.map(c=>getPlayer(c.playerId)).filter(p=>p && !p.guest);
}
function convidadosPresentes(){
  return state.session.checkins.map(c=>getPlayer(c.playerId)).filter(p=>p && p.guest);
}
function regra6Garantida(n){ return associadosPresentes().length >= n*6; }
function effectiveNumTeams(){ return sorteioNumTeams; }
function computeTargets(n, count){
  if(n<=0) return [];
  if(count >= n*6){
    // garante 6 por time e distribui o excedente (7º, 8º jogador...) de forma equilibrada entre os times
    const target = Array(n).fill(6);
    let leftover = count - n*6;
    let i = 0;
    while(leftover>0){
      target[i % n]++;
      leftover--;
      i++;
    }
    return target;
  }
  // sem associados suficientes pra garantir 6 em cada — divide o mais equilibrado possível
  const base = Math.floor(count/n);
  const extra = count % n;
  return Array.from({length:n}, (_,i)=> base + (i<extra?1:0));
}

async function confirmarSorteioManual(){
  const presentes = state.session.checkins.map(c=>getPlayer(c.playerId)).filter(Boolean);
  const n = effectiveNumTeams();
  const teams = Array.from({length:n}, ()=>({players:[]}));
  let unassigned = 0;
  presentes.forEach(p=>{
    const t = manualAssignment[p.id];
    if(t===undefined || t>=n){ unassigned++; return; }
    teams[t].players.push(p.id);
  });

async function moverJogadorDeTime(playerId, newTeamIdxStr){

  state.session.teams.forEach(t=>{ t.players = t.players.filter(id=>id!==playerId); });
  state.session.teams[newIdx].players.push(playerId);
  await saveSession();
  render();

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function gerarImagemTimes(){
  const teams = state.session.teams;
  const W = 720;
  const headerH = 150;
  const teamHeaderH = 54;
  const rowH = 38;
  const teamGap = 20;
  const footerH = 46;
  let H = headerH;
  teams.forEach(t=> H += teamHeaderH + Math.max(t.players.length,1)*rowH + teamGap);
  H += footerH;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#12171c');
  grad.addColorStop(1, '#0a0d10');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#4CAF50';
  ctx.font = 'bold 30px Arial, sans-serif';
  ctx.fillText(state.settings.groupName || 'Pelada', W/2, 50);

  ctx.fillStyle = '#F5F6F7';
  ctx.font = 'bold 22px Arial, sans-serif';
  ctx.fillText('Times sorteados', W/2, 82);

  ctx.fillStyle = '#8A8F98';
  ctx.font = '15px Arial, sans-serif';
  ctx.fillText(todayLabel(), W/2, 108);

  let y = headerH;
  teams.forEach((team,i)=>{
    ctx.fillStyle = teamColorHex(i);
    roundRect(ctx, 24, y, W-48, teamHeaderH-14, 10);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(teamColorName(i), 42, y + (teamHeaderH-14)/2 + 7);
    y += teamHeaderH;

    if(team.players.length===0){
      ctx.fillStyle = '#565B63';
      ctx.font = 'italic 16px Arial, sans-serif';
      ctx.fillText('(sem jogadores)', 42, y+24);
      y += rowH;
    }
    team.players.forEach(pid=>{
      const p = getPlayer(pid); if(!p) return;
      ctx.fillStyle = '#F5F6F7';
      ctx.font = '17px Arial, sans-serif';
      ctx.textAlign = 'left';
      const tag = p.position==='GOL' ? '🧤 ' : '•  ';
      ctx.fillText(tag + p.name + (p.guest ? '  (convidado)' : ''), 42, y+25);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#8A8F98';
      ctx.font = '14px Arial, sans-serif';
      ctx.fillText(p.position, W-42, y+25);
      y += rowH;
    });
    y += teamGap;
  });

  ctx.fillStyle = '#565B63';
  ctx.font = '13px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Gerado pelo app da pelada', W/2, H-18);

  return canvas;
}
async function compartilharTimes(){

  await compartilharImagemGenerica(gerarImagemTimes(), 'times-sorteados.png', 'Times sorteados');

function checkinOrderOf(playerId){
  const c = state.session.checkins.find(c=>c.playerId===playerId);
  return c ? c.order : Infinity;
}
function orderByArrival(players){
  return players.slice().sort((a,b)=>checkinOrderOf(a.id)-checkinOrderOf(b.id));
}
function distribuirConvidados(convidados, teams, n){
  const ordem = orderByArrival(convidados);
  let i = 0;
  while(i < ordem.length){
    for(let t=0; t<n && i<ordem.length; t++){
      teams[t].players.push(ordem[i].id);
      i++;
    }
  }
}
function distribuirGrupos(teams, targets, idsDisponiveis){
  const grupos = state.session.grupos3 || [];
  const jaColocados = new Set();
  grupos.forEach(g=>{
    const membros = orderByArrival(g.players.filter(id=>idsDisponiveis.has(id)).map(getPlayer).filter(Boolean));
    const timesUsados = new Set();
    membros.forEach(p=>{
      let best=-1;
      // 1ª tentativa: time livre (sob o alvo) que ainda não tem ninguém desse grupo
      for(let i=0;i<teams.length;i++){
        if(timesUsados.has(i)) continue;
        if(teams[i].players.length >= targets[i]) continue;
        if(best===-1 || teams[i].players.length < teams[best].players.length) best=i;
      }
      // 2ª tentativa (sem time livre único): qualquer time sob o alvo, mesmo repetindo
      if(best===-1){
        for(let i=0;i<teams.length;i++){
          if(teams[i].players.length >= targets[i]) continue;
          if(best===-1 || teams[i].players.length < teams[best].players.length) best=i;
        }
      }
      if(best===-1) return;
      teams[best].players.push(p.id);
      timesUsados.add(best);
      jaColocados.add(p.id);
    });
  });
  return jaColocados;
}
async function renomearTime(i){
  if(!state.session.teams[i]) return;
  const atual = teamColorName(i);
  const novo = prompt('Nome do time:', atual);
  if(novo===null) return;
  const nome = novo.trim();
  state.session.teams[i].name = nome || null;
  await saveSession();
  render();
}
async function resetarTimes(){
  if(!confirm('Isso vai apagar os times sorteados, os grupos de 3, todo o histórico de partidas (usado na classificação) e volta a contagem de rodadas pra 1 — a chegada de hoje não é afetada. Use isso quando quiser começar um campeonato novo do zero. Continuar?')) return;
  state.session.teams = [];
  state.session.grupos3 = [];
  state.session.matches = [];
  state.session.rodadaAtual = 1;
  await saveSession();
  render();
}
async function sortear(){
  const associados = associadosPresentes();
  const convidados = convidadosPresentes();
  const n = effectiveNumTeams();
  if(n<1){ alert('Não há jogadores suficientes pra formar times.'); return; }
  const teams = Array.from({length:n}, ()=>({players:[]}));
  const targets = computeTargets(n, associados.length);
  const idsDisponiveis = new Set(associados.map(p=>p.id));
  const jaColocados = distribuirGrupos(teams, targets, idsDisponiveis);

  if(sorteioMode==='aleatorio'){
    const goleiros = orderByArrival(associados.filter(p=>p.position==='GOL' && !jaColocados.has(p.id)));
    const outros = orderByArrival(associados.filter(p=>p.position!=='GOL' && !jaColocados.has(p.id)));
    goleiros.forEach(p=>{
      let best=-1;
      for(let i=0;i<n;i++){
        if(teams[i].players.length < targets[i] && (best===-1 || teams[i].players.length < teams[best].players.length)) best=i;
      }
      if(best===-1) return;
      teams[best].players.push(p.id);
    });
    outros.forEach(p=>{
      let best=-1;
      for(let i=0;i<n;i++){
        if(teams[i].players.length >= targets[i]) continue;
        if(best===-1 || teams[i].players.length < teams[best].players.length) best=i;
      }
      if(best===-1) return;
      teams[best].players.push(p.id);
    });
  } else {
    const goleiros = orderByArrival(associados.filter(p=>p.position==='GOL' && !jaColocados.has(p.id)));
    const outros = orderByArrival(associados.filter(p=>p.position!=='GOL' && !jaColocados.has(p.id))).sort((a,b)=>b.level-a.level);
    goleiros.forEach(p=>{
      let best=-1;
      for(let i=0;i<n;i++){
        if(teams[i].players.length < targets[i] && (best===-1 || teams[i].players.length < teams[best].players.length)) best=i;
      }
      if(best===-1) return;
      teams[best].players.push(p.id);
    });
    const sums = teams.map(t=>t.players.reduce((s,pid)=>s+(getPlayer(pid)?.level||0),0));
    outros.forEach(p=>{
      let best=-1;
      for(let i=0;i<n;i++){
        if(teams[i].players.length >= targets[i]) continue;
        if(best===-1 || sums[i]<sums[best]) best=i;
      }
      if(best===-1) return;
      teams[best].players.push(p.id);
      sums[best]+=p.level;
    });
  }

  // convidados só entram depois dos associados já distribuídos, um por time
  distribuirConvidados(convidados, teams, n);

  state.session.teams = teams;
  state.session.matches = [];
  await saveSession();
  render();
}

let rodadaVisualizada = null;
let editandoPartidaId = null;

function getRodadaVisualizada(){
  if(rodadaVisualizada===null) rodadaVisualizada = state.session.rodadaAtual || 1;
  return rodadaVisualizada;
}
function navegarRodada(delta){
  const nova = getRodadaVisualizada() + delta;
  if(nova<1) return;
  rodadaVisualizada = nova;
  editandoPartidaId = null;
  render();
}
async function comecarRodada(){
  if(getLiveMatch()){ alert('Encerre a partida ao vivo antes de avançar de rodada.'); return; }
  state.session.rodadaAtual = (state.session.rodadaAtual || 1) + 1;
  rodadaVisualizada = state.session.rodadaAtual;
  await saveSession();
  render();
}
async function corrigirNumeroRodada(){
  const atual = state.session.rodadaAtual || 1;
  const resposta = prompt('Corrigir o número da rodada atual.\n\nUse isso se o contador avançou errado (por exemplo, pulou rodadas que não aconteceram). Isso NÃO apaga nenhuma partida já jogada, só ajusta em qual rodada as novas partidas vão entrar a partir de agora.', atual);
  if(resposta===null) return;
  const novo = parseInt(resposta);
  if(isNaN(novo) || novo<1){ alert('Digite um número válido (1 ou mais).'); return; }
  state.session.rodadaAtual = novo;
  rodadaVisualizada = novo;
  await saveSession();
  render();
}

function rodadaTemJogos(n){
  return (state.session.matches||[]).some(m=>m.finished && (m.rodada||1)===n);
}
function renderPartida(){
  const teams = state.session.teams;
  let html = `<div class="eyebrow">Partida</div>`;
  if(teams.length===0){
    html += `<div class="empty"><span class="icon">🎲</span><div class="msg">Sorteie os times primeiro na aba Sorteio.</div></div>`;
    return html;
  }
  const rodadaReal = state.session.rodadaAtual || 1;
  const rv = getRodadaVisualizada();
  const live = getLiveMatch();

  let statusLabel;
  if(rv===rodadaReal) statusLabel = 'rodada atual';
  else if(rv<rodadaReal) statusLabel = rodadaTemJogos(rv) ? 'encerrada' : 'vazia (número pulado)';
  else statusLabel = 'ainda não começou';

  html += `<div class="card row between" style="padding:10px 12px;">
    <button class="btn btn-ghost btn-sm" onclick="navegarRodada(-1)" ${rv<=1?'disabled':''}>◀</button>
    <div style="text-align:center;">
      <div class="name">Rodada ${rv}</div>
      <div class="meta">${statusLabel}</div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="navegarRodada(1)">▶</button>
  </div>

  if(rv < rodadaReal){
    html += renderRodadaPassada(rv);
    return html;
  }
  if(rv > rodadaReal){
    html += `<div class="empty"><span class="icon">🗓️</span><div class="msg">A rodada ${rv} ainda não começou — será disputada em outro dia. Nada é salvo aqui até você começar ela de verdade.</div></div>`;
    if(live){
      html += `<div class="meta" style="text-align:center;">Encerre a partida ao vivo (na rodada ${rodadaReal}) antes de começar essa aqui.</div>`;
    } else {
      html += `<button class="btn btn-primary btn-block" onclick="comecarRodada()">🏁 Começar rodada ${rodadaReal+1}</button>`;
    }
    return html;
  }

  // rv === rodadaReal: rodada em andamento

    html += `<div class="meta" style="text-align:center; margin-bottom:10px;">Encerre a partida ao vivo antes de avançar de rodada.</div>`;

    html += `<div class="eyebrow" style="margin-top:14px;">Partidas encerradas nesta rodada</div>`;
    html += renderDestaqueRodadaCard(jogosDaRodada);

    html += `<button class="btn btn-ghost btn-block btn-sm" onclick="compartilharRodada(${rodadaReal})">📤 Compartilhar rodada (imagem)</button>`;
  }

    html += `<div class="divider"></div>
      <button class="btn btn-danger btn-block" onclick="zerarPartidas()">🗑️ Zerar partidas</button>`;
  }
  return html;
}
function destaqueDaRodada(jogos){
  const todosEventos = [].concat(...jogos.map(m=>m.events||[]));
  return calcularDestaque(todosEventos);
}
function golsSofridosNaRodada(jogos){
  const porGoleiro = {};
  jogos.forEach(m=>{
    const teamA = state.session.teams[m.teamA]; const teamB = state.session.teams[m.teamB];
    const goleirosA = teamA ? teamA.players.map(getPlayer).filter(p=>p && p.position==='GOL') : [];
    const goleirosB = teamB ? teamB.players.map(getPlayer).filter(p=>p && p.position==='GOL') : [];
    goleirosA.forEach(p=>{ porGoleiro[p.id] = (porGoleiro[p.id]||0) + m.scoreB; });
    goleirosB.forEach(p=>{ porGoleiro[p.id] = (porGoleiro[p.id]||0) + m.scoreA; });
  });
  return porGoleiro;
}
function melhorGoleiroDaRodada(jogos){
  const porGoleiro = golsSofridosNaRodada(jogos);
  let melhor = null;
  Object.keys(porGoleiro).forEach(pid=>{
    const sofridos = porGoleiro[pid];
    if(!melhor || sofridos < melhor.sofridos) melhor = {playerId:pid, sofridos};
  });
  return melhor;
}
function renderDestaqueRodadaCard(jogos){

function renderRodadaPassada(rv){
  const rodadas = agruparPorRodada(state.session.matches);

  if(!info || info.jogos.length===0){
    html += `<div class="empty"><span class="icon">📅</span><div class="msg">Nenhuma partida registrada nessa rodada.<br>Se esse número foi pulado sem querer, use "⚙️ corrigir número da rodada" ali em cima.</div></div>`;

function formatTimer(seconds){
  const mm = Math.floor(seconds/60), ss = seconds%60;
  return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}
function currentTimerSeconds(m){
  let secs = m.timerSeconds||0;
  if(m.timerRunning && m.timerStartedAt) secs += Math.floor((Date.now()-m.timerStartedAt)/1000);
  return secs;
}
async function toggleTimer(matchId){
  const m = getMatchById(matchId); if(!m) return;
  if(m.timerRunning){
    m.timerSeconds = currentTimerSeconds(m);
    m.timerRunning = false;
    m.timerStartedAt = null;
  } else {
    m.timerRunning = true;
    m.timerStartedAt = Date.now();
  }
  await saveSession();
  render();
}
async function resetTimer(matchId){
  const m = getMatchById(matchId); if(!m) return;

  m.timerSeconds = 0;

  m.timerStartedAt = null;

}

async function zerarPartidas(){
  if(!confirm('Isso vai apagar TODO o histórico de partidas (todas as rodadas, incluindo a partida ao vivo se houver) e zerar a tabela de classificação. Os times sorteados continuam salvos.\n\nAtenção: os gols, assistências, cartões e vitórias já contabilizados na aba Ranking NÃO são desfeitos automaticamente por essa ação. Se quiser zerar isso também, use o botão "Zerar ranking" na aba Ranking.\n\nContinuar?')) return;
  state.session.matches = [];
  state.session.rodadaAtual = 1;
  rodadaVisualizada = 1;
  await saveSession();
  render();
}
function agruparPorRodada(matches){
  const finalizadas = (matches || []).filter(m=>m.finished);
  if(finalizadas.some(m=>m.rodada)){
    const numeros = [...new Set(finalizadas.map(m=>m.rodada||1))].sort((a,b)=>a-b);
    return numeros.map(num=>{
      const jogos = finalizadas.filter(m=>(m.rodada||1)===num);
      return { rodada:num, date: jogos[jogos.length-1].date, jogos };
    });
  }
  // compatibilidade: partidas antigas sem número de rodada, agrupa por data
  const datasUnicas = [...new Set(finalizadas.map(m=>m.date))].sort();
  return datasUnicas.map((date,i)=>({
    rodada: i+1,
    date,
    jogos: finalizadas.filter(m=>m.date===date)
  }));
}
function avgLevel(teamIdx){
  const team = state.session.teams[teamIdx]; if(!team || team.players.length===0) return 0;
  return Math.round(team.players.reduce((s,pid)=>s+(getPlayer(pid)?.level||0),0)/team.players.length);
}
function renderEventRow(ev){
  const [icon,label] = eventLabel(ev);
  return `<div class="evrow"><span>${icon}</span><span>${label}</span></div>`;
}
function renderEventRowEditable(matchId, ev, idx){
  const [icon,label] = eventLabel(ev);
  const canEdit = ev.type==='goal' || ev.type==='owngoal';
  return `<div class="evrow" style="justify-content:space-between;">
    <span>${icon} ${label}</span>
    <span style="display:flex; gap:4px; flex-shrink:0;">
      ${canEdit ? `<button class="btn btn-ghost btn-sm" style="padding:3px 8px; font-size:11px;" onclick="abrirEdicaoGol('${matchId}',${idx})">✏️</button>` : ''}
      <button class="btn btn-danger btn-sm" style="padding:3px 8px; font-size:11px;" onclick="excluirEvento('${matchId}',${idx})">🗑️</button>
    </span>
  </div>`;
}
function getMatchById(matchId){ return state.session.matches.find(m=>m.id===matchId); }
function calcularDestaque(events){
  const pontos = {};
  (events||[]).forEach(ev=>{
    if(ev.type==='goal'){ pontos[ev.playerId] = pontos[ev.playerId] || {gols:0, assist:0}; pontos[ev.playerId].gols++; }
    if(ev.type==='assist'){ pontos[ev.playerId] = pontos[ev.playerId] || {gols:0, assist:0}; pontos[ev.playerId].assist++; }
  });
  let melhor = null;
  Object.keys(pontos).forEach(pid=>{
    const s = pontos[pid];
    const score = s.gols*2 + s.assist;
    if(score<=0) return;
    if(!melhor || score>melhor.score || (score===melhor.score && s.gols>melhor.gols)){
      melhor = {playerId:pid, gols:s.gols, assist:s.assist, score};
    }
  });
  return melhor;
}
function destaqueLabel(destaque){
  if(!destaque) return '';
  const p = getPlayer(destaque.playerId);
  if(!p) return '';
  const partes = [];
  if(destaque.gols>0) partes.push(`${destaque.gols}⚽`);
  if(destaque.assist>0) partes.push(`${destaque.assist}🎯`);
  return `⭐ Destaque: ${escapeHtml(p.name)} (${partes.join(' ')})`;
}
function eventLabel(ev){
  const p = getPlayer(ev.playerId); const name = p ? p.name : '—';
  const map = {goal:['⚽',`Gol de ${name}`], owngoal:['🥅',`Gol contra de ${name}`], assist:['🎯',`Assistência de ${name}`], yellow:['🟨',`Cartão amarelo — ${name}`], blue:['🟦',`Cartão azul — ${name}`], red:['🟥',`Cartão vermelho — ${name}`]};
  return map[ev.type] || ['•', name];
}
function gerarImagemPartida(matchId){
  const m = getMatchById(matchId); if(!m) return null;
  const events = m.events;
  const destaque = calcularDestaque(events);
  const W = 720;
  const headerH = 110;
  const scoreboardH = 190;
  const destaqueH = destaque ? 36 : 0;
  const rowH = 34;
  const eventsHeaderH = 40;
  const footerH = 46;
  const eventsAreaH = events.length>0 ? eventsHeaderH + events.length*rowH : 60;
  const H = headerH + scoreboardH + destaqueH + eventsAreaH + footerH;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0, '#12171c');
  bgGrad.addColorStop(1, '#0a0d10');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#4CAF50';
  ctx.font = 'bold 28px Arial, sans-serif';
  ctx.fillText(state.settings.groupName || 'Pelada', W/2, 46);
  ctx.fillStyle = '#8A8F98';
  ctx.font = '15px Arial, sans-serif';
  ctx.fillText(todayLabel() + (m.finished ? ' — partida encerrada' : ' — ao vivo'), W/2, 74);

  // placar
  const sbY = headerH, sbH = scoreboardH;
  const sbGrad = ctx.createRadialGradient(W/2, sbY, 40, W/2, sbY+sbH/2, W/1.3);
  sbGrad.addColorStop(0, '#1b3a20');
  sbGrad.addColorStop(1, '#0d1610');
  ctx.fillStyle = sbGrad;
  roundRect(ctx, 24, sbY, W-48, sbH, 16);
  ctx.fill();
  ctx.strokeStyle = 'rgba(76,175,80,0.35)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, 24, sbY, W-48, sbH, 16);
  ctx.stroke();

  const midY = sbY + sbH/2;
  ctx.fillStyle = '#F5F6F7';
  ctx.font = 'bold 20px Arial, sans-serif';
  ctx.fillText(teamColorName(m.teamA), W*0.27, midY-30);
  ctx.fillText(teamColorName(m.teamB), W*0.73, midY-30);

  ctx.fillStyle = '#E4B93B';
  ctx.font = 'bold 64px Arial, sans-serif';
  ctx.fillText(String(m.scoreA), W*0.27, midY+45);
  ctx.fillText(String(m.scoreB), W*0.73, midY+45);

  ctx.font = '13px Arial, sans-serif';
  ctx.textAlign = 'center';

function gerarImagemRodada(rodadaInfo){
  const jogos = rodadaInfo.jogos;
  const destaque = destaqueDaRodada(jogos);
  const W = 720;
  const headerH = 150;
  const destaqueH = destaque ? 46 : 0;
  const rowH = 56;
  const footerH = 46;
  const H = headerH + destaqueH + Math.max(jogos.length,1)*rowH + footerH;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#12171c');
  grad.addColorStop(1, '#0a0d10');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#4CAF50';
  ctx.font = 'bold 30px Arial, sans-serif';
  ctx.fillText(state.settings.groupName || 'Pelada', W/2, 50);

  ctx.fillStyle = '#F5F6F7';
  ctx.font = 'bold 22px Arial, sans-serif';
  ctx.fillText(`Rodada ${rodadaInfo.rodada}`, W/2, 82);

  ctx.fillStyle = '#8A8F98';
  ctx.font = '15px Arial, sans-serif';
  const dataFmt = new Date(rodadaInfo.date+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  ctx.fillText(dataFmt, W/2, 108);

  let y = headerH;
  if(destaque){
    const p = getPlayer(destaque.playerId);
    if(p){
      ctx.fillStyle = '#E4B93B';
      ctx.font = 'bold 18px Arial, sans-serif';
      ctx.textAlign = 'center';
      const partes = [];
      if(destaque.gols>0) partes.push(`${destaque.gols}⚽`);
      if(destaque.assist>0) partes.push(`${destaque.assist}🎯`);
      ctx.fillText(`⭐ Destaque da rodada: ${p.name} (${partes.join(' ')})`, W/2, y+28);
    }
    y += destaqueH;
  }
  jogos.forEach((m,i)=>{
    if(i%2===0){ ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(24,y,W-48,rowH); }
    ctx.textAlign = 'left';
    ctx.fillStyle = '#F5F6F7';
    ctx.font = 'bold 18px Arial, sans-serif';
    ctx.fillText(teamColorName(m.teamA), 40, y+34);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#E4B93B';
    ctx.font = 'bold 24px Arial, sans-serif';
    ctx.fillText(`${m.scoreA} × ${m.scoreB}`, W/2, y+36);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#F5F6F7';
    ctx.font = 'bold 18px Arial, sans-serif';
    ctx.fillText(teamColorName(m.teamB), W-40, y+34);
    y += rowH;
  });

  ctx.fillStyle = '#565B63';
  ctx.font = '13px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Gerado pelo app da pelada', W/2, H-18);

  return canvas;
}

async function confirmarEdicaoGol(matchId, eventIndex){
  const m = getMatchById(matchId); if(!m) return;
  const ev = m.events[eventIndex]; if(!ev) return;
  const novoId = document.getElementById('editGolSel_'+matchId).value;
  if(novoId !== ev.playerId){
    if(ev.type==='goal'){
      const antigo = getPlayer(ev.playerId); if(antigo) antigo.goals = Math.max(0,(antigo.goals||0)-1);
      const novo = getPlayer(novoId); if(novo) novo.goals = (novo.goals||0)+1;

    await savePlayers();
  }
  actionDiv(matchId).innerHTML = '';

}
async function excluirEvento(matchId, eventIndex){
  const m = getMatchById(matchId); if(!m) return;
  const ev = m.events[eventIndex]; if(!ev) return;
  if(!confirm('Excluir esse evento? Isso desfaz o efeito dele no placar/estatísticas.')) return;
  if(ev.type==='goal' || ev.type==='owngoal'){
    if(ev.side==='A') m.scoreA = Math.max(0, m.scoreA-1); else m.scoreB = Math.max(0, m.scoreB-1);
    if(ev.type==='goal'){ const p=getPlayer(ev.playerId); if(p) p.goals=Math.max(0,(p.goals||0)-1); }
  } else if(ev.type==='assist'){
    const p=getPlayer(ev.playerId); if(p) p.assists=Math.max(0,(p.assists||0)-1);
  } else if(ev.type==='yellow'){
    const p=getPlayer(ev.playerId); if(p) p.yellow=Math.max(0,(p.yellow||0)-1);
    if(m.cardCounts) m.cardCounts[ev.playerId+'_y'] = Math.max(0,(m.cardCounts[ev.playerId+'_y']||1)-1);
  } else if(ev.type==='blue'){
    const p=getPlayer(ev.playerId); if(p) p.blue=Math.max(0,(p.blue||0)-1);
  } else if(ev.type==='red'){
    const p=getPlayer(ev.playerId); if(p) p.red=Math.max(0,(p.red||0)-1);
  }
  m.events.splice(eventIndex,1);
  actionDiv(matchId).innerHTML='';
  await saveSession(); await savePlayers(); render();
}

async function finishMatch(){
  const m = getLiveMatch(); if(!m) return;
  if(!confirm('Encerrar esta partida?')) return;
  m.finished = true;
  const teamA = state.session.teams[m.teamA].players, teamB = state.session.teams[m.teamB].players;
  const winner = m.scoreA>m.scoreB ? 'A' : m.scoreB>m.scoreA ? 'B' : null;
  teamA.forEach(pid=>{
    const p=getPlayer(pid); if(!p) return;
    p.matchesPlayed=(p.matchesPlayed||0)+1;
    if(winner==='A') p.wins=(p.wins||0)+1;
    if(p.position==='GOL'){ p.gamesAsGK=(p.gamesAsGK||0)+1; if(m.scoreB===0) p.cleanSheets=(p.cleanSheets||0)+1; p.goalsConceded=(p.goalsConceded||0)+m.scoreB; }
  });
  teamB.forEach(pid=>{
    const p=getPlayer(pid); if(!p) return;
    p.matchesPlayed=(p.matchesPlayed||0)+1;
    if(winner==='B') p.wins=(p.wins||0)+1;
    if(p.position==='GOL'){ p.gamesAsGK=(p.gamesAsGK||0)+1; if(m.scoreA===0) p.cleanSheets=(p.cleanSheets||0)+1; p.goalsConceded=(p.goalsConceded||0)+m.scoreA; }
  });
  await saveSession(); await savePlayers(); render();
}

function computeStandings(){
  const teams = state.session.teams || [];
  const tabela = teams.map((t,i)=>({idx:i, nome:teamColorName(i), j:0, v:0, e:0, d:0, gp:0, gc:0, sg:0, pts:0}));
  const finalizadas = (state.session.matches || []).filter(m=>m.finished);
  finalizadas.forEach(m=>{
    const A = tabela[m.teamA], B = tabela[m.teamB];
    if(!A || !B) return;
    A.j++; B.j++;
    A.gp += m.scoreA; A.gc += m.scoreB;
    B.gp += m.scoreB; B.gc += m.scoreA;
    if(m.scoreA > m.scoreB){ A.v++; A.pts+=3; B.d++; }
    else if(m.scoreB > m.scoreA){ B.v++; B.pts+=3; A.d++; }
    else { A.e++; B.e++; A.pts+=1; B.pts+=1; }
  });
  tabela.forEach(t=> t.sg = t.gp - t.gc);
  tabela.sort((a,b)=> b.pts-a.pts || b.sg-a.sg || b.gp-a.gp || a.nome.localeCompare(b.nome));
  return tabela;
}

function computeH2H(){
  const finalizadas = (state.session.matches || []).filter(m=>m.finished);
  const pares = {};
  finalizadas.forEach(m=>{
    const menor = Math.min(m.teamA, m.teamB), maior = Math.max(m.teamA, m.teamB);
    const chave = menor+'_'+maior;
    if(!pares[chave]) pares[chave] = { timeMenor:menor, timeMaior:maior, jogos:0, vMenor:0, vMaior:0, empates:0, golsMenor:0, golsMaior:0 };
    const par = pares[chave];
    par.jogos++;
    const scoreMenor = m.teamA===menor ? m.scoreA : m.scoreB;
    const scoreMaior = m.teamA===maior ? m.scoreA : m.scoreB;
    par.golsMenor += scoreMenor; par.golsMaior += scoreMaior;
    if(scoreMenor>scoreMaior) par.vMenor++;
    else if(scoreMaior>scoreMenor) par.vMaior++;
    else par.empates++;
  });
  return Object.values(pares).sort((a,b)=> b.jogos-a.jogos);
}

function gerarImagemRanking(){
  const players = state.players;
  const artilheiros = players.filter(p=>(p.goals||0)>0).sort((a,b)=>(b.goals||0)-(a.goals||0)).slice(0,5);
  const garcons = players.filter(p=>(p.assists||0)>0).sort((a,b)=>(b.assists||0)-(a.assists||0)).slice(0,5);
  const vitorias = players.filter(p=>(p.wins||0)>0).sort((a,b)=>(b.wins||0)-(a.wins||0)).slice(0,5);
  const cartoes = players.filter(p=>(p.yellow||0)+(p.blue||0)+(p.red||0)>0)
    .sort((a,b)=>((b.yellow||0)+2*(b.blue||0)+3*(b.red||0))-((a.yellow||0)+2*(a.blue||0)+3*(a.red||0))).slice(0,5);
  const classificacao = computeStandings().filter(t=>t.j>0);

  const sections = [
    {title:'🥇 Artilharia', icon:'⚽', rows: artilheiros.map(p=>[p.name, String(p.goals||0)])},
    {title:'🎯 Garçons (assistências)', icon:'🎯', rows: garcons.map(p=>[p.name, String(p.assists||0)])},
    {title:'🏅 Mais vitórias', icon:'🏅', rows: vitorias.map(p=>[p.name, String(p.wins||0)])},
    {title:'🟨🟦🟥 Cartões', icon:'🟨', rows: cartoes.map(p=>[p.name, `${p.yellow||0} 🟨  ${p.blue||0} 🟦  ${p.red||0} 🟥`])},
  ].filter(s=>s.rows.length>0);

  const W = 720;
  const headerH = 150;
  const classifTitleH = classificacao.length>0 ? 36 : 0;
  const classifHeaderH = classificacao.length>0 ? 30 : 0;
  const classifRowH = 40;
  const classifGap = classificacao.length>0 ? 22 : 0;
  const sectionTitleH = 44;
  const rowH = 38;
  const sectionGap = 16;
  const footerH = 46;
  let H = headerH;
  H += classifTitleH + classifHeaderH + classificacao.length*classifRowH + classifGap;
  sections.forEach(s=> H += sectionTitleH + s.rows.length*rowH + sectionGap);
  H += footerH;
  if(sections.length===0 && classificacao.length===0) H += 60;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#12171c');
  grad.addColorStop(1, '#0a0d10');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#4CAF50';
  ctx.font = 'bold 30px Arial, sans-serif';
  ctx.fillText(state.settings.groupName || 'Pelada', W/2, 50);

  ctx.fillStyle = '#F5F6F7';
  ctx.font = 'bold 22px Arial, sans-serif';
  ctx.fillText('Ranking', W/2, 82);

  ctx.fillStyle = '#8A8F98';
  ctx.font = '15px Arial, sans-serif';
  ctx.fillText(todayLabel(), W/2, 108);

  let y = headerH;

  // tabela de classificação (colunas de verdade, igual ao app)
  if(classificacao.length>0){
    ctx.fillStyle = '#E4B93B';
    ctx.font = 'bold 19px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('🏆 Classificação', 30, y+24);
    y += classifTitleH;

    const tableX = 24, tableW = W-48;
    const nameW = 230;
    const statW = (tableW-nameW)/8;
    const statCols = ['J','V','E','D','GP','GC','SG','PTS'];

    // cabeçalho
    ctx.fillStyle = '#8A8F98';
    ctx.font = 'bold 12px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('TIME', tableX+42, y+20);
    statCols.forEach((c,ci)=>{
      ctx.textAlign = 'center';
      ctx.fillText(c, tableX+nameW+statW*ci+statW/2, y+20);
    });
    y += classifHeaderH;

    classificacao.forEach((t,i)=>{
      if(i%2===0){ ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(tableX,y,tableW,classifRowH); }
      // posição
      const posColors = ['#E4B93B','#c8ccc8','#c98a4e'];
      if(i<3){
        ctx.fillStyle = posColors[i];
        roundRect(ctx, tableX+8, y+8, 24, 24, 6);
        ctx.fill();
        ctx.fillStyle = '#1a1305';
        ctx.font = 'bold 13px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(i+1), tableX+20, y+25);
      } else {
        ctx.fillStyle = '#8A8F98';
        ctx.font = 'bold 13px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(i+1)+'.', tableX+20, y+25);
      }
      ctx.fillStyle = '#F5F6F7';
      ctx.font = i===0 ? 'bold 16px Arial, sans-serif' : '16px Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(t.nome, tableX+42, y+25, nameW-46);

      const stats = [t.j, t.v, t.e, t.d, t.gp, t.gc, (t.sg>0?'+':'')+t.sg, t.pts];
      stats.forEach((val,ci)=>{
        ctx.fillStyle = ci===7 ? '#4CAF50' : (ci===6 && t.sg<0) ? '#E5484D' : ci===6 && t.sg>0 ? '#4CAF50' : '#F5F6F7';
        ctx.font = ci===7 ? 'bold 16px Arial, sans-serif' : '13px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(val), tableX+nameW+statW*ci+statW/2, y+25);
      });
      y += classifRowH;
    });
    y += classifGap;
  }

  if(sections.length===0 && classificacao.length===0){
    ctx.fillStyle = '#565B63';
    ctx.font = 'italic 16px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Ainda sem estatísticas registradas', W/2, y+30);
  }
  sections.forEach(sec=>{
    ctx.fillStyle = '#E4B93B';
    ctx.font = 'bold 19px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(sec.title, 30, y+26);
    y += sectionTitleH;
    sec.rows.forEach((row,i)=>{
      if(i%2===0){ ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(24,y,W-48,rowH); }
      ctx.fillStyle = i===0 ? '#E4B93B' : '#F5F6F7';
      ctx.font = 'bold 16px Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`${i+1}. ${row[0]}`, 42, y+25);
      ctx.fillStyle = '#8A8F98';
      ctx.font = '16px Arial, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(row[1], W-42, y+25);
      y += rowH;
    });
    y += sectionGap;
  });

  ctx.fillStyle = '#565B63';
  ctx.font = '13px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Gerado pelo app da pelada', W/2, H-18);

  return canvas;
}

let financeiroMonth = null; // 'YYYY-MM' — null significa mês atual

function labelForMonth(mk){
  const [y,m] = mk.split('-').map(Number);

function shiftMonth(mk, delta){
  const [y,m] = mk.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
