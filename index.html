/* ================= PIX (QR CODE) ================= */
function emvField(id, value){
  const len = String(value.length).padStart(2,'0');
  return id + len + value;
}
function crc16ccitt(str){
  let crc = 0xFFFF;
  for(let i=0;i<str.length;i++){
    crc ^= (str.charCodeAt(i) << 8);
    for(let j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc<<1) ^ 0x1021) & 0xFFFF : (crc<<1) & 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function normalizarTextoPix(str){
  return (str||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9 ]/g,'');
}
function gerarPayloadPix(chave, nome, cidade, valor, txid){
  nome = normalizarTextoPix(nome||'PELADA').substring(0,25) || 'PELADA';
  cidade = normalizarTextoPix(cidade||'BRASIL').substring(0,15) || 'BRASIL';
  txid = (txid||'***').replace(/[^a-zA-Z0-9]/g,'').substring(0,25) || '***';
  const merchantAccountInfo = emvField('26', emvField('00','BR.GOV.BCB.PIX') + emvField('01', chave));
  const valorField = valor ? emvField('54', Number(valor).toFixed(2)) : '';
  let payload = emvField('00','01') + merchantAccountInfo + emvField('52','0000') + emvField('53','986') +
    valorField + emvField('58','BR') + emvField('59', nome) + emvField('60', cidade) +
    emvField('62', emvField('05', txid)) + '6304';
  return payload + crc16ccitt(payload);
}
async function configurarPix(){
  const atual = state.settings.pix || {};
  const chave = prompt('Chave Pix (CPF, celular, e-mail ou chave aleatória):', atual.chave||'');
  if(chave===null) return;
  const nome = prompt('Nome do recebedor (como aparece no Pix):', atual.nome||'');
  if(nome===null) return;
  const cidade = prompt('Cidade do recebedor:', atual.cidade||'');
  if(cidade===null) return;
  state.settings.pix = { chave: chave.trim(), nome: nome.trim(), cidade: cidade.trim() };
  await saveSettings();
  render();
}
let qrPixAberto = null;
function abrirQrPix(playerId){
  const p = getPlayer(playerId); if(!p) return;
  const pix = state.settings.pix;
  if(!pix || !pix.chave){ alert('Configure sua chave Pix primeiro, no botão "⚙️ Configurar Pix" no topo da aba.'); return; }
  const due = (p.dues||[]).find(d=>d.month===currentFinanceiroMonth());
  if(!due){ alert('Esse jogador não tem cobrança lançada nesse mês.'); return; }
  const payload = gerarPayloadPix(pix.chave, pix.nome, pix.cidade, due.value, 'PELADA'+p.id.slice(0,6).toUpperCase());
  qrPixAberto = { playerId, payload };
  render();
}
function fecharQrPix(){
  qrPixAberto = null;
  render();
}
function desenharQrPix(){
  if(!qrPixAberto) return;
  const el = document.getElementById('qrcode-container');
  if(!el) return;
  el.innerHTML = '';
  try{
    if(typeof QRCode === 'undefined'){ el.innerHTML = '<div class="meta">Não consegui carregar o gerador de QR Code — verifique sua internet.</div>'; return; }
    new QRCode(el, { text: qrPixAberto.payload, width:220, height:220, colorDark:'#101317', colorLight:'#ffffff' });
  }catch(e){
    console.error(e);
    el.innerHTML = '<div class="meta">Não consegui gerar o QR Code.</div>';
  }
}
async function copiarCodigoPix(){
  if(!qrPixAberto) return;
  try{
    await navigator.clipboard.writeText(qrPixAberto.payload);
    alert('Código Pix copiado! É só colar no app do banco em "Pix Copia e Cola".');
  }catch(e){
    alert('Não consegui copiar automaticamente. Toque e segure no código pra copiar manualmente.');
  }
}
function gerarImagemCobranca(playerId){
  const p = getPlayer(playerId); if(!p) return null;
  const mk = currentFinanceiroMonth();
  const due = (p.dues||[]).find(d=>d.month===mk);
  if(!due) return null;
  const W = 720;
  const headerH = 150;
  const qrSize = 280;
  const footerH = 110;
  const H = headerH + qrSize + 40 + footerH;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#12171c');
  grad.addColorStop(1, '#0a0d10');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#4CAF50';
  ctx.font = 'bold 28px Arial, sans-serif';
  ctx.fillText(state.settings.groupName || 'Pelada', W/2, 46);

  ctx.fillStyle = '#F5F6F7';
  ctx.font = 'bold 22px Arial, sans-serif';
  ctx.fillText('Cobrança Pix', W/2, 78);

  ctx.fillStyle = '#8A8F98';
  ctx.font = '15px Arial, sans-serif';
  ctx.fillText(`${p.name} · ${labelForMonth(mk)}`, W/2, 105);

  ctx.fillStyle = '#E4B93B';
  ctx.font = 'bold 30px Arial, sans-serif';
  ctx.fillText(`R$ ${due.value}`, W/2, 140);

  const qrCanvas = document.querySelector('#qrcode-container canvas');
  const qrX = (W-qrSize)/2, qrY = headerH;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(qrX-12, qrY-12, qrSize+24, qrSize+24);
  if(qrCanvas){
    ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
  } else {
    ctx.fillStyle = '#999';
    ctx.font = '14px Arial, sans-serif';
    ctx.fillText('QR indisponível', W/2, qrY+qrSize/2);
  }

  ctx.fillStyle = '#F5F6F7';
  ctx.font = '15px Arial, sans-serif';
  ctx.fillText('Escaneie com o app do seu banco', W/2, qrY+qrSize+40);
  ctx.fillText('ou use "Pix Copia e Cola"', W/2, qrY+qrSize+62);

  ctx.fillStyle = '#565B63';
  ctx.font = '13px Arial, sans-serif';
  ctx.fillText('Gerado pelo app da pelada', W/2, H-18);

  return canvas;
}
async function compartilharCobranca(){
  if(!qrPixAberto) return;
  const canvas = gerarImagemCobranca(qrPixAberto.playerId);
  if(!canvas){ alert('Não encontrei essa cobrança.'); return; }
  await compartilharImagemGenerica(canvas, 'cobranca-pix.png', 'Cobrança Pix');
}
function renderFinanceiro(){
  const mk = currentFinanceiroMonth();
  const isCurrent = mk === monthKey();
  const year = mk.split('-')[0];
  const players = state.players.filter(p=>!p.guest).sort((a,b)=>a.name.localeCompare(b.name));
  let recebido=0, pendente=0, inadimplentes=0;
  players.forEach(p=>{
    const due = (p.dues||[]).find(d=>d.month===mk);
    if(due){ if(due.status==='pago') recebido += due.value; else { pendente += due.value; inadimplentes++; } }
  });
  const despesasDoMes = (state.despesas||[]).filter(d=>d.month===mk);
  const totalDespesasMes = despesasDoMes.reduce((s,d)=>s+d.valor,0);
  const saldoMes = recebido - totalDespesasMes;

  // resumo do ano inteiro
  const meses = Array.from({length:12}, (_,i)=>year+'-'+String(i+1).padStart(2,'0'));
  const porMes = {}; meses.forEach(mkey=>porMes[mkey]={recebido:0, pendente:0, despesa:0});
  let anoRecebido=0, anoPendente=0, anoDespesa=0;
  players.forEach(p=>{
    (p.dues||[]).forEach(d=>{
      if(!porMes[d.month]) return;
      if(d.status==='pago'){ porMes[d.month].recebido += d.value; anoRecebido += d.value; }
      else { porMes[d.month].pendente += d.value; anoPendente += d.value; }
    });
  });
  (state.despesas||[]).forEach(d=>{
    if(!porMes[d.month]) return;
    porMes[d.month].despesa += d.valor; anoDespesa += d.valor;
  });

  let html = `<div class="eyebrow">Caixa da pelada</div>`;
  html += `<div class="card row between" style="padding:10px 12px;">
    <button class="btn btn-ghost btn-sm" onclick="goToMonth(-1)">◀</button>
    <div style="text-align:center;">
      <div class="name" style="text-transform:capitalize;">${labelForMonth(mk)}</div>
      ${!isCurrent ? `<div class="meta" style="cursor:pointer; color:var(--green-light);" onclick="goToCurrentMonth()">voltar pro mês atual</div>` : `<div class="meta">mês atual</div>`}
    </div>
    <button class="btn btn-ghost btn-sm" onclick="goToMonth(1)">▶</button>
  </div>`;

  html += `<div class="pillrow">
    <div class="pill"><div class="v">R$${recebido}</div><div class="l">Recebido</div></div>
    <div class="pill"><div class="v">R$${totalDespesasMes}</div><div class="l">Despesas</div></div>
    <div class="pill"><div class="v" style="color:${saldoMes>=0?'var(--green-light)':'var(--danger)'};">R$${saldoMes}</div><div class="l">Saldo do mês</div></div>
  </div>`;
  html += `<div class="pillrow">
    <div class="pill"><div class="v">R$${pendente}</div><div class="l">Em aberto</div></div>
    <div class="pill"><div class="v">${inadimplentes}</div><div class="l">Inadimplentes</div></div>
  </div>`;

  html += `<button class="btn btn-outline btn-block" style="margin-bottom:10px;" onclick="exportarPlanilha()">📊 Exportar planilha (Excel)</button>`;

  html += `<div class="card">
    <div class="meta" style="margin-bottom:8px;">Pega as cobranças já lançadas em ${labelForMonth(mk)} e replica (mesmo valor e forma de pagamento) para os outros meses de ${year} que ainda estiverem vazios — sem mexer em meses que já têm cobrança lançada.</div>
    <button class="btn btn-primary btn-block" onclick="replicarCobrancasDoAno()">🔁 Preencher o ano todo com base neste mês</button>
  </div>`;

  html += `<div class="eyebrow">Resumo de ${year} <small>ano todo</small></div>`;
  html += `<div class="pillrow">
    <div class="pill"><div class="v">R$${anoRecebido}</div><div class="l">Recebido</div></div>
    <div class="pill"><div class="v">R$${anoDespesa}</div><div class="l">Despesas</div></div>
    <div class="pill"><div class="v" style="color:${(anoRecebido-anoDespesa)>=0?'var(--green-light)':'var(--danger)'};">R$${anoRecebido-anoDespesa}</div><div class="l">Saldo</div></div>
  </div>`;
  html += `<div class="card">
    <div style="overflow-x:auto;"><table class="rank" style="min-width:100%;">
    <thead><tr><th>Mês</th><th style="text-align:center;">Receb.</th><th style="text-align:center;">Desp.</th><th style="text-align:center;">Saldo</th></tr></thead><tbody>
      ${meses.map(mkey=>{
        const nomeMes = labelForMonth(mkey).split(' de ')[0];
        const destaque = mkey===mk ? 'style="color:var(--green-light); font-weight:700;"' : '';
        const saldo = porMes[mkey].recebido - porMes[mkey].despesa;
        return `<tr ${destaque}><td style="text-transform:capitalize;">${nomeMes}</td><td class="num">R$${porMes[mkey].recebido}</td><td class="num" style="color:var(--danger);">R$${porMes[mkey].despesa}</td><td class="num" style="color:${saldo>=0?'var(--green-light)':'var(--danger)'};">R$${saldo}</td></tr>`;
      }).join('')}
    </tbody></table></div>
  </div>`;

  html += `<div class="eyebrow">Despesas <small style="text-transform:capitalize;">${labelForMonth(mk)}</small></div>`;
  html += `<button class="btn btn-outline btn-block" style="margin-bottom:10px;" onclick="addDespesa()">+ Lançar despesa</button>`;
  if(despesasDoMes.length===0){
    html += `<div class="empty"><span class="icon">🧾</span><div class="msg">Nenhuma despesa lançada nesse mês.</div></div>`;
  } else {
    despesasDoMes.forEach(d=>{
      html += `<div class="card row between">
        <div><div class="name">${escapeHtml(d.descricao)}</div><div class="meta">R$${d.valor}</div></div>
        <div class="row" style="gap:6px;">
          <button class="btn btn-ghost btn-sm" onclick="editarDespesa('${d.id}')">✏️ Editar</button>
          <button class="btn btn-danger btn-sm" onclick="removerDespesa('${d.id}')">✕</button>
        </div>
      </div>`;
    });
  }

  html += `<div class="eyebrow">Mensalidades <small style="text-transform:capitalize;">${labelForMonth(mk)}</small></div>`;
  html += `<button class="btn btn-outline btn-block" style="margin-bottom:10px;" onclick="abrirResumoAnual()">📊 Ver resumo do ano (todos, pendentes e pagos)</button>`;
  html += `<div class="row between" style="margin-bottom:10px; align-items:flex-start;">
    <div class="meta" style="flex:1;">Convidados não entram nessa lista automaticamente — só associados têm mensalidade por padrão.</div>
    <button class="btn btn-ghost btn-sm" style="flex-shrink:0; margin-left:8px;" onclick="configurarPix()">⚙️ Configurar Pix</button>
  </div>`;
  if(qrPixAberto){
    const pQr = getPlayer(qrPixAberto.playerId);
    html += `<div class="card" style="text-align:center;">
      <div class="name" style="margin-bottom:10px;">QR Pix — ${pQr?escapeHtml(pQr.name):''}</div>
      <div id="qrcode-container" style="display:flex; justify-content:center; margin-bottom:10px;"></div>
      <button class="btn btn-outline btn-block btn-sm" style="margin-bottom:6px;" onclick="copiarCodigoPix()">📋 Copiar código Pix</button>
      <button class="btn btn-primary btn-block btn-sm" style="margin-bottom:6px;" onclick="compartilharCobranca()">📤 Compartilhar cobrança (imagem)</button>
      <button class="btn btn-ghost btn-block btn-sm" onclick="fecharQrPix()">Fechar</button>
    </div>`;
  }
  if(players.length===0){
    html += `<div class="empty"><span class="icon">💰</span><div class="msg">Cadastre jogadores na aba Elenco para lançar cobranças.</div></div>`;
  } else {
    players.forEach(p=>{
      const due = (p.dues||[]).find(d=>d.month===mk);
      html += `<div class="card row between">
        <div><div class="name">${escapeHtml(p.name)}</div>${due ? `<div class="meta">R$${due.value} · ${due.method}</div>` : '<div class="meta">Sem cobrança lançada</div>'}</div>
        ${due
          ? `<div class="row" style="gap:6px; flex-wrap:wrap; justify-content:flex-end;">
              ${due.status!=='pago' ? `<button class="btn btn-outline btn-sm" onclick="abrirQrPix('${p.id}')">📱 Pix</button>` : ''}
              <button class="btn btn-ghost btn-sm" onclick="editarDue('${p.id}')">✏️ Editar</button>
              <button class="btn btn-sm ${due.status==='pago'?'btn-primary':'btn-outline'}" onclick="toggleDue('${p.id}')">${due.status==='pago'?'Pago ✓':'Marcar pago'}</button>
              <button class="btn btn-danger btn-sm" onclick="removeDue('${p.id}')">✕</button>
            </div>`
          : `<button class="btn btn-ghost btn-sm" onclick="addDue('${p.id}')">+ Lançar cobrança</button>`
        }
      </div>`;
    });
  }
  return html;
}
async function addDespesa(){
  const mk = currentFinanceiroMonth();
  const descricao = prompt(`Descrição da despesa de ${labelForMonth(mk)} (ex: aluguel da quadra, bolas novas):`, '');
  if(descricao===null || !descricao.trim()) return;
  const valorStr = prompt('Valor da despesa (R$):', '');
  if(valorStr===null) return;
  const valor = parseFloat(valorStr) || 0;
  state.despesas = state.despesas || [];
  state.despesas.push({id:uid(), month:mk, descricao:descricao.trim(), valor});
  await saveDespesas();
  render();
}
async function editarDespesa(despesaId){
  const d = (state.despesas||[]).find(x=>x.id===despesaId); if(!d) return;
  const descricao = prompt('Descrição:', d.descricao);
  if(descricao===null) return;
  const valorStr = prompt('Valor (R$):', d.valor);
  if(valorStr===null) return;
  d.descricao = descricao.trim() || d.descricao;
  d.valor = parseFloat(valorStr) || d.valor;
  await saveDespesas();
  render();
}
async function removerDespesa(despesaId){
  if(!confirm('Remover essa despesa?')) return;
  state.despesas = (state.despesas||[]).filter(x=>x.id!==despesaId);
  await saveDespesas();
  render();
}
function exportarPlanilha(){
  if(typeof XLSX === 'undefined'){ alert('Não consegui carregar o gerador de planilha — verifique sua internet e tente de novo.'); return; }

  const receitas = [];
  state.players.filter(p=>!p.guest).forEach(p=>{
    (p.dues||[]).slice().sort((a,b)=>a.month.localeCompare(b.month)).forEach(d=>{
      receitas.push({ Jogador:p.name, Mes:labelForMonth(d.month), Valor:d.value, Forma:d.method, Status: d.status==='pago'?'Pago':'Pendente' });
    });
  });

  const despesas = (state.despesas||[]).slice().sort((a,b)=>a.month.localeCompare(b.month)).map(d=>({
    Mes: labelForMonth(d.month), Descricao: d.descricao, Valor: d.valor
  }));

  const porMes = {};
  state.players.filter(p=>!p.guest).forEach(p=>{
    (p.dues||[]).forEach(d=>{
      porMes[d.month] = porMes[d.month] || {receita:0, despesa:0};
      if(d.status==='pago') porMes[d.month].receita += d.value;
    });
  });
  (state.despesas||[]).forEach(d=>{
    porMes[d.month] = porMes[d.month] || {receita:0, despesa:0};
    porMes[d.month].despesa += d.valor;
  });
  const resumo = Object.keys(porMes).sort().map(mk=>({
    Mes: labelForMonth(mk),
    Receita: porMes[mk].receita,
    Despesa: porMes[mk].despesa,
    Saldo: porMes[mk].receita - porMes[mk].despesa
  }));
  const totalReceita = resumo.reduce((s,r)=>s+r.Receita,0);
  const totalDespesa = resumo.reduce((s,r)=>s+r.Despesa,0);
  resumo.push({ Mes:'TOTAL', Receita:totalReceita, Despesa:totalDespesa, Saldo: totalReceita-totalDespesa });

  if(receitas.length===0 && despesas.length===0){
    alert('Ainda não há cobranças nem despesas lançadas pra exportar.');
    return;
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumo), 'Resumo Mensal');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(receitas.length?receitas:[{Jogador:'',Mes:'',Valor:'',Forma:'',Status:''}]), 'Receitas');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(despesas.length?despesas:[{Mes:'',Descricao:'',Valor:''}]), 'Despesas');

  const nomeArquivo = 'financeiro-' + normalizarTextoPix(state.settings.groupName||'pelada').replace(/\s+/g,'-').toLowerCase() + '.xlsx';
  try{
    XLSX.writeFile(wb, nomeArquivo);
  }catch(e){
    console.error(e);
    alert('Não consegui gerar o arquivo da planilha.');
  }
}
async function addDue(playerId){
  const p = getPlayer(playerId); if(!p) return;
  const mk = currentFinanceiroMonth();
  const valueStr = prompt(`Valor da mensalidade de ${labelForMonth(mk)} (R$):`, '30');
  if(valueStr===null) return;
  const value = parseFloat(valueStr) || 0;
  const method = prompt('Forma de pagamento (pix, dinheiro, cartão):', 'pix') || 'pix';
  p.dues = p.dues || [];
  p.dues = p.dues.filter(d=>d.month!==mk);
  p.dues.push({id:uid(), month:mk, value, method, status:'pendente'});
  await savePlayers(); render();
}
async function toggleDue(playerId){
  const p = getPlayer(playerId); if(!p) return;
  const mk = currentFinanceiroMonth();
  const due = (p.dues||[]).find(d=>d.month===mk); if(!due) return;
  due.status = due.status==='pago' ? 'pendente' : 'pago';
  await savePlayers(); render();
}
async function editarDue(playerId){
  const p = getPlayer(playerId); if(!p) return;
  const mk = currentFinanceiroMonth();
  const due = (p.dues||[]).find(d=>d.month===mk); if(!due) return;
  const valueStr = prompt(`Editar valor da mensalidade de ${labelForMonth(mk)} (R$):`, due.value);
  if(valueStr===null) return;
  const method = prompt('Forma de pagamento:', due.method);
  if(method===null) return;
  due.value = parseFloat(valueStr) || due.value;
  due.method = method.trim() || due.method;
  await savePlayers(); render();
}
async function removeDue(playerId){
  const p = getPlayer(playerId); if(!p) return;
  const mk = currentFinanceiroMonth();
  p.dues = (p.dues||[]).filter(d=>d.month!==mk);
  await savePlayers(); render();
}
async function replicarCobrancasDoAno(){
  const mk = currentFinanceiroMonth();
  const year = mk.split('-')[0];
  const comCobranca = state.players.filter(p=>(p.dues||[]).some(d=>d.month===mk));
  if(comCobranca.length===0){
    alert(`Não há nenhuma cobrança lançada em ${labelForMonth(mk)} pra usar como modelo. Lance a cobrança de pelo menos um jogador nesse mês primeiro.`);
    return;
  }
  if(!confirm(`Isso vai pegar a cobrança de cada jogador em ${labelForMonth(mk)} e criar a mesma cobrança (valor e forma de pagamento) em todos os outros meses de ${year} que ainda estiverem vazios para aquele jogador. Meses que já têm cobrança lançada não serão alterados. Continuar?`)) return;

  let created = 0;
  comCobranca.forEach(p=>{
    const template = (p.dues||[]).find(d=>d.month===mk);
    if(!template) return;
    for(let m=1; m<=12; m++){
      const key = year + '-' + String(m).padStart(2,'0');
      if(key===mk) continue;
      p.dues = p.dues || [];
      if(!p.dues.some(d=>d.month===key)){
        p.dues.push({id:uid(), month:key, value:template.value, method:template.method, status:'pendente'});
        created++;
      }
    }
  });
  await savePlayers();
  render();
  alert(`Pronto! ${created} cobrança(s) criada(s) para o restante do ano. Todas entram como "pendente" — é só ir marcando como pago mês a mês.`);
}
